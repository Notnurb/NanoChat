<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripplet NanoChat | Powered by NanoLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@0.263.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Mocking Lucide icons for CDN usage
        const Icon = ({ name, className }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                const icon = lucide.icons[name];
                if (icon) {
                    const svgString = lucide.createIcons({
                        icons: { [name]: icon },
                        attrs: { class: className }
                    });
                }
            }, [name, className]);
            // Simplified: Using basic Lucide component replacement
            const LucideIcon = ({ icon: IconComponent, ...props }) => <IconComponent {...props} />;
            return null;
        };

        // Re-assigning Icons from the global lucide object
        const { 
            Plus, ChevronDown, ArrowUp, Settings, X, File: FileIcon, Zap, Brain, 
            Bot, Layers, Globe, Telescope, Search, MessageSquare, 
            PanelLeftClose, PanelLeftOpen, Clock, MoreHorizontal 
        } = lucide;

        const MODELS = [
            { id: 'instant', name: 'R2 Instant', description: 'Fast Responses, Good Quality', icon: Zap, color: 'text-amber-500', bg: 'bg-amber-50' },
            { id: 'thinking', name: 'R2 Thinking', description: 'Extended Capabilities Than Instant', icon: Brain, color: 'text-purple-500', bg: 'bg-purple-50' },
            { id: 'agent', name: 'R2 Agent', description: 'Access to pro features.', icon: Bot, color: 'text-blue-500', bg: 'bg-blue-50' },
            { id: 'matrix', name: 'R2 Agent Matrix', description: 'Agent with higher token limits.', icon: Layers, color: 'text-rose-500', bg: 'bg-rose-50' },
        ];

        const MODIFIERS = [
            { id: 'web_search', label: 'Web Search', icon: Search, color: 'text-blue-500', bg: 'bg-blue-50' },
            { id: 'deep_research', label: 'Deep Research', icon: Telescope, color: 'text-emerald-500', bg: 'bg-emerald-50' },
            { id: 'website_generation', label: 'Website Generation', icon: Globe, color: 'text-indigo-500', bg: 'bg-indigo-50' },
        ];

        function App() {
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [inputValue, setInputValue] = useState('');
            const [files, setFiles] = useState([]);
            const [selectedModel, setSelectedModel] = useState(MODELS[0]);
            const [selectedModifier, setSelectedModifier] = useState(null);
            const [isModelMenuOpen, setIsModelMenuOpen] = useState(false);
            const [isModifierMenuOpen, setIsModifierMenuOpen] = useState(false);

            const fileInputRef = useRef(null);
            const showModelSelector = !['deep_research', 'website_generation'].includes(selectedModifier || '');
            const isActive = inputValue.trim().length > 0 || files.length > 0;

            useEffect(() => {
                lucide.createIcons();
            }, [isSidebarOpen, isModelMenuOpen, isModifierMenuOpen, files, selectedModifier]);

            const handleFileUpload = (e) => {
                if (e.target.files) {
                    const newFiles = Array.from(e.target.files).map(file => ({
                        name: file.name,
                        type: file.type,
                        url: file.type.startsWith('image/') ? URL.createObjectURL(file) : undefined
                    }));
                    setFiles(prev => [...prev, ...newFiles]);
                }
            };

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden">
                    <motion.aside 
                        initial={false}
                        animate={{ width: isSidebarOpen ? 280 : 0, opacity: isSidebarOpen ? 1 : 0 }}
                        className="bg-white border-r border-gray-200 flex flex-col relative z-30"
                    >
                        <div className="p-4 flex flex-col h-full min-w-[280px]">
                            <button className="flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors mb-6 group text-left">
                                <div className="flex items-center gap-3">
                                    <div className="p-1.5 bg-gray-900 rounded-lg text-white">
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                    </div>
                                    <span className="font-medium text-sm text-gray-700">New Chat</span>
                                </div>
                                <i data-lucide="message-square" className="w-4 h-4 text-gray-400 opacity-0 group-hover:opacity-100"></i>
                            </button>

                            <div className="flex-1 overflow-y-auto">
                                <div className="px-2 mb-4 flex items-center gap-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                    <i data-lucide="clock" className="w-3 h-3"></i> Recent
                                </div>
                                <div className="px-2 text-sm text-gray-400 italic">No recent chats</div>
                            </div>

                            <div className="pt-4 mt-auto border-t border-gray-100">
                                <button className="w-full flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 font-bold text-xs">JD</div>
                                        <span className="text-sm font-medium text-gray-700">John Doe</span>
                                    </div>
                                    <i data-lucide="more-horizontal" className="w-4 h-4 text-gray-400"></i>
                                </button>
                            </div>
                        </div>
                    </motion.aside>

                    <main className="flex-1 flex flex-col relative">
                        <button 
                            onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                            className="absolute top-6 left-6 p-2 text-gray-400 hover:text-gray-900 z-40"
                        >
                            {isSidebarOpen ? <i data-lucide="panel-left-close"></i> : <i data-lucide="panel-left-open"></i>}
                        </button>

                        <div className="flex-1 flex flex-col items-center justify-center p-4 pb-12">
                            <motion.h1 
                                initial={{ opacity: 0, y: -20 }}
                                animate={{ opacity: 1, y: 0 }}
                                className="text-4xl md:text-5xl font-semibold text-gray-900 mb-12 text-center"
                            >
                                What will you create today?
                            </motion.h1>

                            <div className="w-full max-w-2xl bg-white rounded-[26px] border border-gray-300 shadow-sm p-3 relative focus-within:shadow-md transition-all">
                                {files.length > 0 && (
                                    <div className="flex flex-wrap gap-3 mb-3 px-1">
                                        {files.map((file, index) => (
                                            <div key={index} className="relative group">
                                                <div className="h-16 w-16 rounded-xl border border-gray-200 overflow-hidden bg-gray-50 flex items-center justify-center">
                                                    {file.url ? <img src={file.url} className="h-full w-full object-cover" /> : <i data-lucide="file" className="text-gray-400"></i>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <textarea
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    placeholder="Ask Anything..."
                                    className="w-full h-12 bg-transparent resize-none outline-none text-gray-800 text-lg py-2 px-1"
                                />

                                <div className="flex items-center justify-between mt-2">
                                    <div className="flex items-center gap-2">
                                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" multiple />
                                        <button onClick={() => fileInputRef.current.click()} className="w-8 h-8 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-50">
                                            <i data-lucide="plus" className="w-4 h-4"></i>
                                        </button>
                                        
                                        <button onClick={() => setIsModifierMenuOpen(!isModifierMenuOpen)} className="w-8 h-8 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-50">
                                            <i data-lucide="settings" className="w-4 h-4"></i>
                                        </button>

                                        {selectedModifier && (
                                            <div className="inline-flex items-center gap-2 bg-blue-50 px-2.5 py-1 rounded-lg border text-xs font-medium">
                                                <button onClick={() => setSelectedModifier(null)}><i data-lucide="x" className="w-3 h-3"></i></button>
                                                {MODIFIERS.find(m => m.id === selectedModifier)?.label}
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex items-center gap-3">
                                        {showModelSelector && (
                                            <button onClick={() => setIsModelMenuOpen(!isModelMenuOpen)} className="flex items-center gap-2 text-sm font-medium">
                                                {selectedModel.name} <i data-lucide="chevron-down" className="w-4 h-4"></i>
                                            </button>
                                        )}
                                        <button disabled={!isActive} className={`w-8 h-8 flex items-center justify-center rounded-full ${isActive ? 'bg-black text-white' : 'bg-gray-200 text-white'}`}>
                                            <i data-lucide="arrow-up" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
